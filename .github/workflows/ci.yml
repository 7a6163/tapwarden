name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly audit + full mutation run, even without pushes
  workflow_dispatch: # on-demand full mutation run

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS runner: the keychain (apple-native) and LocalAuthentication paths
    # only compile there. Touch ID / live-server tests are #[ignore]d, so the
    # default suite is CI-safe: no prompts, no network.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test (with coverage)
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Build (release)
        run: cargo build --locked --release

  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

  mutants:
    # Coverage proves a line ran; mutation testing proves the suite would
    # notice if it broke. A full sweep is ~30 minutes, so pull requests mutate
    # only the lines they changed and the weekly run covers everything.
    if: github.event_name != 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --in-diff needs the base branch
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutants (changed lines only)
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}..." > pr.diff
          cargo mutants --in-diff pr.diff
      - name: Mutants (full)
        if: github.event_name != 'pull_request'
        run: cargo mutants
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutants-out
          path: mutants.out/
